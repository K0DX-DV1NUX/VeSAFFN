[default]
# Model Information.
d_model = "SharedTST"
d_model_input_type = "x_only"

# RevIN
m_use_norm = true
m_revin_affine = true
m_revin_subtract_last = false

# Shared basis
m_seq_dim = 512   

# Conv-attention blocks (HaDAM-style, cross-channel)
m_num_blocks = 3
m_attn_head_kernel_size = 32
m_dropout = 0.1


