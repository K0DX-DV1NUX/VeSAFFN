[default]
d_model = "HaDAM"
d_model_input_type = "x_only"
m_revin_affine = true
m_revin_subtract_last = false
m_decomp_type = "haar"            # one of: "haar", "trend-residual", None
m_in_patch_size = 8          # must divide seq_len (336 % 16 == 0)
m_out_patch_size = 8         # must divide pred_len (48 % 16 == 0)
m_patch_dim = 256            # intra-patch embedding dimension
m_n_layers = 1
m_attn_head_kernel_size = 32
m_attn_head_dropout = 0.2
m_dropout = 0.2


[[runs]]
d_seq_len = 336
d_pred_len = 48
d_test_stride = 48


