[default]
# Model
d_model = "Naive"
d_model_input_type = "x_only"
m_naive_type = "ltsf"
d_train_epochs = 1

# One run per prediction horizon; d_test_stride = d_pred_len gives non-overlapping test windows.
[[runs]]
d_seq_len = 720
d_pred_len = 96
d_test_stride = 48

[[runs]]
d_seq_len = 720
d_pred_len = 192
d_test_stride = 192

[[runs]]
d_seq_len = 720
d_pred_len = 336
d_test_stride = 336

[[runs]]
d_seq_len = 720
d_pred_len = 720
d_test_stride = 720