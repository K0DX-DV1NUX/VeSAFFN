[default]
# Model
d_model = "PatchTST"
d_model_input_type = "x_only"

# Architecture
m_individual = 0
m_e_layers = 3
m_n_heads = 16
m_d_model = 128
m_d_ff = 256
m_dropout = 0.2
m_fc_dropout = 0.2
m_head_dropout = 0
m_patch_len = 16
m_stride = 8
m_revin = 1
m_affine = 0
m_subtract_last = 0
m_decomposition = 0
m_kernel_size = 25
m_padding_patch = "end"

# One run per prediction horizon; d_test_stride = d_pred_len gives non-overlapping test windows.
[[runs]]
d_seq_len = 336
d_pred_len = 96
d_test_stride = 48

[[runs]]
d_seq_len = 336
d_pred_len = 192
d_test_stride = 192

[[runs]]
d_seq_len = 336
d_pred_len = 336
d_test_stride = 336

[[runs]]
d_seq_len = 336
d_pred_len = 720
d_test_stride = 720