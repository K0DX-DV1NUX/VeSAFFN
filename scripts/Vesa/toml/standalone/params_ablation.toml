# Vesa ablation runs.

[default]
d_is_training = 1
d_train_epochs = 1
d_patience = 1
d_learning_rate = 0.001
d_batch_size = 1
d_train_stride = 5
d_test_stride = 1
d_lradj = "type7"

# Model
d_model = "Vesa"

d_root_path = "../dataset"
d_data = "ETTh1"
d_data_path = "ETTh1.csv"
d_freq = "h"
d_forecast_type = "M"
d_inverse_transform = false
d_in_features = 21
d_out_features = 21

# false: shared scales, true: per-channel scales
m_individual = true

# One run per prediction horizon; d_test_stride = d_pred_len gives non-overlapping test windows.
[[runs]]
d_seq_len = 336
d_pred_len = 192

# FFN hidden dim D and rank r
m_seq_dim = 672
m_vesa_rank = 4
m_wavelet_type = "none"

