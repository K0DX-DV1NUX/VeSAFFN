[default]
# Model Information.
d_model = "Vesa"
d_model_input_type = "x_only"
# Knowledge distillation (TimeDistill, offline only)
d_kd_mode = "offline"
d_kd_type = "timedistill"
d_td_alpha = 1.0
d_td_tau = 0.5
d_td_scales = 3
d_td_window = 2

# RevIN
m_use_norm = true
m_individual = false

# Shared VeRA basis
m_seq_dim = 256
m_vesa_rank = 16


