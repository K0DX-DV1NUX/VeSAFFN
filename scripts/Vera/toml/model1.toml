[default]
# Model Information.
d_model = "Vera"
d_model_input_type = "x_only"
d_kd_teacher_warmup_epochs = 10

# RevIN
m_use_norm = true
m_individual = false

# Online KD: let the teacher train alone for the first N epochs before the
# KD term and the student's own training kick in (see Exp_KD.train). Only
# read by online KD -- offline KD's teacher is already fixed, so this is
# ignored there.


# Shared VeRA basis
m_seq_dim = 256        # hidden dim seq_len//2 -> seq_dim -> pred_len//2
m_vera_rank = 16        # shared low-rank basis size for VeraLinear


# -------------------------
# Datasets
# -------------------------
[[runs]]
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96


[[runs]]
d_seq_len = 336
d_pred_len = 192
d_test_stride = 192


[[runs]]
d_seq_len = 336
d_pred_len = 336
d_test_stride = 336


[[runs]]
d_seq_len = 336
d_pred_len = 720
d_test_stride = 720
