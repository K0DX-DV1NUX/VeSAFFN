[default]
# Model Information.
d_model = "Vera"
d_model_input_type = "x_only"

# RevIN
m_use_norm = true

# Shared VeRA basis
m_seq_dim = 512        # hidden dim seq_len -> seq_dim -> pred_len
m_vera_rank = 32        # shared low-rank basis size for VeraLinear

# Depthwise conv smoothing (applied over the seq_dim axis)
m_dwconv_kernel_size = 32

# -------------------------
# Datasets
# -------------------------
[[runs]]
d_seq_len = 336
d_pred_len = 48
d_test_stride = 48


