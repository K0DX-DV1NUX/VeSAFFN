[default]
# Model
d_model = "Chronos2"
d_model_input_type = "x_only"

# Pretrained and frozen: test only
d_is_training = 0
d_pretrained = true

# One run per prediction horizon; d_test_stride = d_pred_len gives non-overlapping test windows.
[[runs]]
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96

[[runs]]
d_seq_len = 336
d_pred_len = 192
d_test_stride = 192

[[runs]]
d_seq_len = 336
d_pred_len = 336
d_test_stride = 336

[[runs]]
d_seq_len = 336
d_pred_len = 720
d_test_stride = 720
