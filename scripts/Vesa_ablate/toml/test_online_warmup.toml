# Vesa_ablate: online basic KD, teacher-warmup sweep (alpha sweep is offline only).

[default]
# Model
d_model = "Vesa_ablate"
d_model_input_type = "x_only"

# Knowledge distillation
d_kd_mode = "online"
d_kd_type = "basic"


# Decomposition: one-level Haar, same as Vesa
m_decomp = "wavelet"
m_wavelet = "db1"

# RevIN
m_use_norm = true

# false: shared scales, true: per-channel scales
m_individual = true

# FFN hidden dim D and rank r
m_seq_dim = 256
m_vesa_rank = 64

# d_run_tag = a<alpha>_w<warmup> keeps each setting in its own results folder.
# warmup sweep, alpha = 1.0
[[runs]]
d_run_tag = "a1.0_w1"
d_kd_alpha = 1.0
d_kd_teacher_warmup_epochs = 1
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96

