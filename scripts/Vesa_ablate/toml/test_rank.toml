# Vesa_ablate: standalone (no KD) at rank 64 and 16.

[default]
# Model
d_model = "Vesa_ablate"
d_model_input_type = "x_only"

# Decomposition: one-level Haar, same as Vesa
m_decomp = "wavelet"
m_wavelet = "db1"

# RevIN
m_use_norm = true

# false: shared scales, true: per-channel scales
m_individual = true

# FFN hidden dim D and rank r
m_seq_dim = 256

# d_run_tag = r<rank> keeps each rank in its own results folder.
# rank 64
[[runs]]
d_run_tag = "r64"
m_vesa_rank = 64
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96

[[runs]]
d_run_tag = "r64"
m_vesa_rank = 64
d_seq_len = 336
d_pred_len = 192
d_test_stride = 192

[[runs]]
