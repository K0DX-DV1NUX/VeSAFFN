# Vesa_ablate: offline basic KD, alpha sweep.

[default]
# Model
d_model = "Vesa_ablate"
d_model_input_type = "x_only"

# Knowledge distillation
d_kd_mode = "offline"
d_kd_type = "basic"

# Decomposition: one-level Haar, same as Vesa
m_decomp = "wavelet"
m_wavelet = "db1"

# RevIN
m_use_norm = true

# false: shared scales, true: per-channel scales
m_individual = true

# FFN hidden dim D and rank r
m_seq_dim = 256
m_vesa_rank = 64

# d_run_tag = a<alpha> keeps each setting in its own results folder.
# alpha sweep (offline has no warmup: the teacher is frozen)
# alpha = 0 (no KD) comes from the channelwise run in test_gen_vs_channel.toml
[[runs]]
d_run_tag = "a0.2"
d_kd_alpha = 0.2
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96

