# Vesa_ablate: DLinear trend-residual decomposition.

[default]
# Model
d_model = "Vesa_ablate"
d_model_input_type = "x_only"

# RevIN
m_use_norm = true

# false: shared scales, true: per-channel scales
m_individual = true

#### Trend-Residual Decomposition
[[runs]]
d_run_tag = "trend_residual"
m_decomp = "trend_residual"
m_moving_avg = 25
m_seq_dim = 336
m_vesa_rank = 64
d_seq_len = 336
d_pred_len = 96
d_test_stride = 96

